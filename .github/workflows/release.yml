name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup C++ toolchain
        uses: egor-tensin/setup-cpp@v4
        with:
          cmake: true
          ninja: true
          # Default compiler per OS: clang on macOS/Linux, MSVC on Windows

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXCMIXIN_BUILD_EXAMPLES=ON

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Run examples
        run: |
          for exe in build/examples/*_example; do
            if [ -f "$exe" ] || [ -f "$exe.exe" ]; then
              "$exe" || exit 1
            fi
          done

      - name: Package
        run: |
          cmake -B release -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DXCMIXIN_BUILD_EXAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX=install \
            -DBUILD_TESTING=OFF
          cmake --build release --target install

          # Create archive
          cd install
          case "${{ runner.os }}" in
            Linux|macOS)
              tar -czvf ../xcmixin-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}.tar.gz *
              ;;
            Windows)
              powershell -Command "Compress-Archive -Path '*' -DestinationPath '../xcmixin-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}.zip'"
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcmixin-${{ matrix.os }}
          path: xcmixin-${{ steps.version.outputs.VERSION }}-${{ matrix.os }}.*
          retention-days: 5

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: xcmixin v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true
          files: |
            artifacts/xcmixin-ubuntu-latest/*
            artifacts/xcmixin-macos-latest/*
            artifacts/xcmixin-windows-latest/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
