name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler: [clang, gcc]
        exclude:
          - os: macos-latest
            compiler: gcc
          - os: windows-latest
            compiler: gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        if: matrix.compiler == 'gcc'
        run: sudo apt-get update && sudo apt-get install -y g++-13

      - name: Configure CMake
        env:
          CXX: ${{ matrix.compiler == 'gcc' && 'g++-13' || 'clang++' }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXCMIXIN_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run examples
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            Get-ChildItem -Path build/examples -Filter "*_example.exe" | ForEach-Object { & $_.FullName }
          else
            for exe in build/examples/*_example; do [ -f "$exe" ] && "$exe" || [ -f "$exe.exe" ] && "$exe.exe"; done
          fi
