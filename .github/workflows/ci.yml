name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DXCMIXIN_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Build and Run examples (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          for exe in build/examples/*_example; do
            if [ -f "$exe" ]; then
              "$exe"
            fi
          done

      - name: Build and Run examples (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Get-ChildItem -Path build/examples -Filter "*.exe" | ForEach-Object { & $_.FullName }
